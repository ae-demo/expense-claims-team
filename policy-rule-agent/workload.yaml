apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: policy-rule-agent

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  endpoints:
    - component: expense-claims-team-expense-api
      name: http
      visibility: project
      envBindings:
        address: EXPENSE_API_URL
  resources:
    - ref: expense-claims-te-78f6fe06
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
    - ref: expense-claims-te-1a46c17d
      envBindings:
        dbname: POLICY_MEMORY_DB_DBNAME
        host: POLICY_MEMORY_DB_HOST
        password: POLICY_MEMORY_DB_PASSWORD
        port: POLICY_MEMORY_DB_PORT
        user: POLICY_MEMORY_DB_USER
