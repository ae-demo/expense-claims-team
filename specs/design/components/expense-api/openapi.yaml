openapi: 3.0.3
info:
  title: Expense Claims API
  version: 0.1.0
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            claims:read: The caller's own claims
            claims:submit: Create and send a claim
            claims:read-team: Pending claims of the caller's own team
            claims:decide: Approve or reject a submitted claim
            claims:read-all: Every claim, across every team
            policy-rules:read: The active policy rules
            policy-rules:manage: Add, change or remove policy rules
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Claim:
      type: object
      required: [id, merchant, claimDate, total, currency, category, status]
      properties:
        id: { type: string }
        merchant: { type: string }
        claimDate: { type: string, format: date }
        total: { type: number, format: double }
        currency: { type: string, default: LKR }
        category:
          type: string
          enum: [meals, travel, accommodation, office-supplies, other]
        note: { type: string }
        status:
          type: string
          enum: [submitted, approved, rejected]
        employeeId: { type: string }
        submittedAt: { type: string, format: date-time }
        flags:
          type: array
          items: { $ref: '#/components/schemas/Flag' }
        decision:
          $ref: '#/components/schemas/Decision'
    ClaimInput:
      type: object
      required: [merchant, claimDate, total, category]
      properties:
        merchant: { type: string }
        claimDate: { type: string, format: date }
        total: { type: number, format: double }
        currency: { type: string, default: LKR }
        category:
          type: string
          enum: [meals, travel, accommodation, office-supplies, other]
        note: { type: string }
    Flag:
      type: object
      required: [id, ruleId, reason]
      properties:
        id: { type: string }
        ruleId: { type: string }
        reason: { type: string, description: plain-language reason the claim broke the rule }
    Decision:
      type: object
      required: [outcome, comment, decidedAt]
      properties:
        outcome: { type: string, enum: [approved, rejected] }
        comment: { type: string }
        managerId: { type: string }
        decidedAt: { type: string, format: date-time }
    DecisionInput:
      type: object
      required: [outcome, comment]
      properties:
        outcome: { type: string, enum: [approved, rejected] }
        comment: { type: string }
    PolicyRule:
      type: object
      required: [id, category, monthlyCapAmount, active]
      properties:
        id: { type: string }
        category:
          type: string
          enum: [meals, travel, accommodation, office-supplies, other]
        monthlyCapAmount: { type: number, format: double }
        description: { type: string }
        active: { type: boolean, default: true }
    PolicyRuleInput:
      type: object
      required: [category, monthlyCapAmount]
      properties:
        category:
          type: string
          enum: [meals, travel, accommodation, office-supplies, other]
        monthlyCapAmount: { type: number, format: double }
        description: { type: string }
        active: { type: boolean, default: true }
    PolicyCheckInput:
      type: object
      required: [claimDate, total, category]
      properties:
        claimDate: { type: string, format: date }
        total: { type: number, format: double }
        category:
          type: string
          enum: [meals, travel, accommodation, office-supplies, other]
    PolicyCheckResult:
      type: object
      required: [flags]
      properties:
        flags:
          type: array
          items: { $ref: '#/components/schemas/Flag' }
          description: empty when the draft breaks no policy rule
security:
  - oauth2: []
paths:
  /me/claims:
    get:
      operationId: listMyClaims
      summary: The caller's own claims
      security:
        - oauth2: [claims:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [submitted, approved, rejected] }
      responses:
        '200':
          description: The caller's claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: submitClaim
      summary: Create and send a claim, checked against policy on submit
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '201':
          description: Claim created, with any policy flags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: Invalid claim fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/claims/policy-check:
    post:
      operationId: checkClaimPolicy
      summary: Whether a draft claim would break a policy rule, before submitting
      security:
        - oauth2: [claims:submit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyCheckInput' }
      responses:
        '200':
          description: Any flags the draft would raise if submitted as-is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyCheckResult' }
        '400':
          description: Invalid draft fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/team/claims:
    get:
      operationId: listTeamPendingClaims
      summary: Pending claims of the caller's own team
      security:
        - oauth2: [claims:read-team]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: The caller's team's pending claims, with any flags
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /claims:
    get:
      operationId: listAllClaims
      summary: Every claim, across every team
      security:
        - oauth2: [claims:read-all]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: status
          in: query
          schema: { type: string, enum: [submitted, approved, rejected] }
        - name: employeeId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Every claim
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Claim' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /claims/{claimId}/decision:
    post:
      operationId: decideClaim
      summary: Approve or reject a submitted claim, with a comment
      security:
        - oauth2: [claims:decide]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionInput' }
      responses:
        '200':
          description: Decision recorded, claim status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400':
          description: Invalid decision, or the claim was already decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such claim in the caller's reach
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /policy-rules:
    get:
      operationId: listPolicyRules
      summary: The active policy rules
      security:
        - oauth2: [policy-rules:read]
      responses:
        '200':
          description: Policy rules
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyRule' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createPolicyRule
      summary: Add a policy rule
      security:
        - oauth2: [policy-rules:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRuleInput' }
      responses:
        '201':
          description: Policy rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRule' }
        '400':
          description: Invalid policy rule fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /policy-rules/{ruleId}:
    patch:
      operationId: updatePolicyRule
      summary: Change or deactivate a policy rule
      security:
        - oauth2: [policy-rules:manage]
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRuleInput' }
      responses:
        '200':
          description: Policy rule updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRule' }
        '400':
          description: Invalid policy rule fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such policy rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removePolicyRule
      summary: Remove a policy rule
      security:
        - oauth2: [policy-rules:manage]
      parameters:
        - name: ruleId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Policy rule removed
        '404':
          description: No such policy rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
